[package]
name = "hongkong-chinabus-skill"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Hong Kong cross-border travel: coaches, border queues, East Rail, high-speed rail and ferries"
license = "MIT"
repository = "https://github.com/hongkong-ai-labs/hongkong-chinabus-skill"
readme = "README.md"
keywords = ["hong-kong", "cross-border", "coach", "macau", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "hkchinabus"
path = "src/main.rs"

[features]
default = ["source-border", "source-coach", "source-ferry", "source-hsr"]
source-border = []
source-coach = []
source-ferry = []
source-hsr = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
